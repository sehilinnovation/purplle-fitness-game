<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purplle Fitness — QR Code</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Screen view ── */
    body {
      background: #070110;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Rajdhani', sans-serif;
      padding: 40px 20px 60px;
      min-height: 100vh;
    }

    .print-btn {
      margin-bottom: 20px;
      padding: 12px 32px;
      background: linear-gradient(135deg, #e040fb, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .1em;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(224,64,251,.45);
    }

    /* ── Card ── */
    .card {
      position: relative;
      width: 380px;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 26px 0;
      box-shadow:
        0 0 0 1px rgba(224,64,251,0.25),
        0 0 60px rgba(224,64,251,0.18),
        0 0 120px rgba(124,0,255,0.12),
        0 24px 60px rgba(0,0,0,0.9);
    }

    /* dark grid background */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: #0e0818;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(224,64,251,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(124,0,255,0.08) 0%, transparent 50%),
        linear-gradient(rgba(224,64,251,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(224,64,251,0.04) 1px, transparent 1px);
      background-size: auto, auto, 28px 28px, 28px 28px;
      z-index: 0;
    }

    /* bottom glow */
    .card::after {
      content: '';
      position: absolute;
      bottom: -20px; left: 50%;
      transform: translateX(-50%);
      width: 300px; height: 160px;
      background: radial-gradient(ellipse, rgba(224,64,251,0.14) 0%, rgba(124,0,255,0.08) 40%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .top-stripe {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, #e040fb 20%, #7c3aed 60%, #e040fb 80%, transparent);
      z-index: 2;
      box-shadow: 0 0 10px rgba(224,64,251,0.8);
    }

    /* neon lines */
    .neon-lines { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .neon-lines::before {
      content: ''; position: absolute; top: 5%; left: -10%; width: 120%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(224,64,251,.12), transparent);
      transform: rotate(-6deg);
      box-shadow: 0 80px 0 rgba(224,64,251,.06), 0 160px 0 rgba(224,64,251,.04);
    }

    /* corner brackets */
    .corner { position: absolute; width: 22px; height: 22px; z-index: 1; border-color: rgba(224,64,251,.35); border-style: solid; }
    .corner-tl { top: 10px; left: 10px;   border-width: 2px 0 0 2px; border-radius: 3px 0 0 0; }
    .corner-tr { top: 10px; right: 10px;  border-width: 2px 2px 0 0; border-radius: 0 3px 0 0; }
    .corner-bl { bottom: 10px; left: 10px;  border-width: 0 0 2px 2px; border-radius: 0 0 0 3px; }
    .corner-br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; border-radius: 0 0 3px 0; }

    /* ── Content ── */
    .content {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center; width: 100%;
    }

    .icon-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 1.4rem; }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.35rem; font-weight: 900; letter-spacing: .07em;
      text-align: center; line-height: 1.25; margin-bottom: 2px;
      background: linear-gradient(180deg, #ffffff 0%, #e040fb 55%, #7c3aed 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .tagline { font-size: .6rem; color: #e040fb; letter-spacing: .22em; text-transform: uppercase; margin-bottom: 4px; opacity: .8; }

    .divider {
      width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(224,64,251,.4), rgba(124,0,255,.3), transparent);
      margin: 10px 0;
    }

    .scan-label { font-size: .65rem; color: #888; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 10px; }

    /* ── QR box ── */
    .qr-wrap {
      background: #fff; border-radius: 12px; padding: 12px;
      position: relative; margin-bottom: 14px;
      box-shadow: 0 0 0 1px rgba(224,64,251,.2), 0 0 24px rgba(224,64,251,.35), 0 0 48px rgba(124,0,255,.15), 0 6px 24px rgba(0,0,0,.7);
    }
    .qr-wrap::before {
      content: ''; position: absolute; inset: -2px; border-radius: 14px;
      background: linear-gradient(90deg, #e040fb, #7c3aed, #e040fb);
      background-size: 200% 100%; animation: border-anim 3s linear infinite; z-index: -1; opacity: .55;
    }
    @keyframes border-anim { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

    .qr-corner-tl, .qr-corner-tr, .qr-corner-bl, .qr-corner-br {
      position: absolute; width: 13px; height: 13px; border-style: solid; border-color: #e040fb;
    }
    .qr-corner-tl { top: -2px; left: -2px;   border-width: 2px 0 0 2px; border-radius: 3px 0 0 0; }
    .qr-corner-tr { top: -2px; right: -2px;  border-width: 2px 2px 0 0; border-radius: 0 3px 0 0; }
    .qr-corner-bl { bottom: -2px; left: -2px;  border-width: 0 0 2px 2px; border-radius: 0 0 0 3px; }
    .qr-corner-br { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; border-radius: 0 0 3px 0; }

    /* ── Prize chips ── */
    .prizes-strip { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
    .prize-chip {
      background: rgba(224,64,251,.07); border: 1px solid rgba(224,64,251,.18); border-radius: 20px;
      padding: 2px 8px; font-size: .6rem; color: #ccc; letter-spacing: .04em; white-space: nowrap;
    }

    /* ── Address ── */
    .address { text-align: center; margin-bottom: 4px; width: 100%; }
    .address .branch {
      font-family: 'Orbitron', sans-serif; font-size: .72rem; font-weight: 700;
      color: #e040fb; letter-spacing: .07em;
      background: rgba(224,64,251,0.08);
      border: 1px solid rgba(224,64,251,0.25);
      border-radius: 8px;
      padding: 7px 16px;
      display: block;
      text-shadow: 0 0 8px rgba(224,64,251,.4);
    }
    .address .location { font-size: .62rem; color: #666; letter-spacing: .03em; line-height: 1.6; margin-top: 6px; }

    /* ── Footer strip ── */
    .footer-strip {
      width: calc(100% + 52px); margin: 10px -26px 0;
      background: rgba(224,64,251,.04); border-top: 1px solid rgba(224,64,251,.12);
      padding: 8px 26px;
      display: flex; justify-content: space-between; align-items: center;
      border-radius: 0 0 20px 20px;
    }
    .footer-strip .dev { font-size: .56rem; color: #444; letter-spacing: .04em; }
    .footer-strip .dev span { color: #e040fb; font-weight: 700; }
    .footer-strip .phone { font-size: .6rem; color: #555; letter-spacing: .04em; }

    /* ══════════════════════════════════
       PRINT STYLES — exact card size
    ══════════════════════════════════ */
    @page {
      size: 380px 640px;
      margin: 0;
    }

    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

      html {
        width: 380px !important;
        height: 640px !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      body {
        width: 380px !important;
        min-height: 640px !important;
        background: #070110 !important;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
        overflow: visible !important;
      }

      .print-btn { display: none !important; }

      .card {
        width: 380px !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 28px 26px 0 !important;
      }

      h1 {
        background: none !important;
        -webkit-text-fill-color: #ffffff !important;
        color: #ffffff !important;
      }

      .address .branch {
        background: rgba(224,64,251,0.08) !important;
        border: 1px solid rgba(224,64,251,0.25) !important;
        -webkit-print-color-adjust: exact !important;
      }

      /* stop animation in print */
      .qr-wrap::before { animation: none !important; background: #e040fb !important; opacity: .4 !important; }
    }
  </style>
</head>
<body>

  <button class="print-btn" onclick="window.print()">⬇ Download PDF</button>

  <div class="card">
    <div class="top-stripe"></div>
    <div class="neon-lines"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="content">
      <div class="icon-row">💪 🌸</div>

      <h1>PURPLLE FITNESS</h1>
      <div class="tagline">Train &middot; Tone &middot; Triumph</div>

      <div class="divider"></div>
      <div class="scan-label">⬇ Scan &amp; Win Exciting Prizes ⬇</div>

      <div class="qr-wrap">
        <div class="qr-corner-tl"></div>
        <div class="qr-corner-tr"></div>
        <div class="qr-corner-bl"></div>
        <div class="qr-corner-br"></div>
        <div id="qrcode"></div>
      </div>

      <div class="prizes-strip">
        <span class="prize-chip">💪 Trial Class</span>
        <span class="prize-chip">🥤 Protein Shake</span>
        <span class="prize-chip">🧘 Yoga Session</span>
        <span class="prize-chip">💆 Assessment</span>
        <span class="prize-chip">👑 VIP Pass</span>
        <span class="prize-chip">🎀 Goodie Bag</span>
      </div>

      <div class="divider"></div>

      <div class="address">
        <div class="branch">Purplle Fitness &mdash; For Ladies</div>
        <div class="location">
          📍 CMC Colony, 2nd St, Near Collector's Office Road<br>
          Sathuvachari, Vellore 632009
        </div>
      </div>

      <div class="footer-strip">
        <div class="dev">Developed by <span>SEHIL</span></div>
        <div class="phone">📞 9605371435</div>
      </div>
    </div>
  </div>

<script>
  const gameUrl = 'https://sehilinnovation.github.io/purplle-fitness-game/';

  new QRCode(document.getElementById('qrcode'), {
    text: gameUrl,
    width: 220,
    height: 220,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
</script>
</body>
</html>
